name: Publish homepage
on:
  push:
    branches: [main]
    paths:
      - index.html
      - .nojekyll
      - README.md
      - .github/workflows/deploy.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: publish-homepage
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure deployment key
        env:
          DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/pages_deploy
          chmod 600 ~/.ssh/pages_deploy
          # Use GitHub's published host keys over authenticated HTTPS.
          curl --fail --silent --show-error https://api.github.com/meta | python3 -c 'import json,sys; print("\n".join("github.com " + key for key in json.load(sys.stdin)["ssh_keys"]))' > ~/.ssh/known_hosts
      - name: Sync website repository
        env:
          GIT_SSH_COMMAND: ssh -i /home/runner/.ssh/pages_deploy -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/pages"
          git clone --depth=1 --branch master git@github.com:Aias00/aias00.github.io.git "$target"
          git -C "$target" rm -r --ignore-unmatch .
          cp index.html .nojekyll README.md "$target/"
          git -C "$target" config user.name 'github-actions[bot]'
          git -C "$target" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$target" add --all
          if git -C "$target" diff --cached --quiet; then
            echo 'Website already up to date.'
            exit 0
          fi
          git -C "$target" commit -m "Publish homepage from ${GITHUB_SHA}"
          git -C "$target" push origin HEAD:master
      - name: Remove deployment key
        if: always()
        run: rm -f ~/.ssh/pages_deploy
